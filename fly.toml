# Fly.io config. Rename `app`, then follow docs/DEPLOY.md.
app = "wukong-demo"
primary_region = "bom"

[build]

[env]
  PORT = "3000"
  WUKONG_DATA_DIR = "/data"

# Off-chain content (briefs, entries, judge reports) and simulated-worker keys.
[[mounts]]
  source = "wukong_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # The keeper runs in the same machine: keep it awake.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
