<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#1A2848"/>
      <stop offset=".7" stop-color="#0C1424"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#E9A21F"/>
    </linearGradient>
    <clipPath id="skull"><ellipse cx="500" cy="530" rx="262" ry="265"/></clipPath>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- sunburst -->
  <g fill="#2B3CFF" opacity="0.07">
    <path id="ray" d="M500 525 L1400 525 L1392.3 642.5 Z"/>
    <use href="#ray" transform="rotate(15 500 525)"/>
    <use href="#ray" transform="rotate(30 500 525)"/>
    <use href="#ray" transform="rotate(45 500 525)"/>
    <use href="#ray" transform="rotate(60 500 525)"/>
    <use href="#ray" transform="rotate(75 500 525)"/>
    <use href="#ray" transform="rotate(90 500 525)"/>
    <use href="#ray" transform="rotate(105 500 525)"/>
    <use href="#ray" transform="rotate(120 500 525)"/>
    <use href="#ray" transform="rotate(135 500 525)"/>
    <use href="#ray" transform="rotate(150 500 525)"/>
    <use href="#ray" transform="rotate(165 500 525)"/>
    <use href="#ray" transform="rotate(180 500 525)"/>
    <use href="#ray" transform="rotate(195 500 525)"/>
    <use href="#ray" transform="rotate(210 500 525)"/>
    <use href="#ray" transform="rotate(225 500 525)"/>
    <use href="#ray" transform="rotate(240 500 525)"/>
    <use href="#ray" transform="rotate(255 500 525)"/>
    <use href="#ray" transform="rotate(270 500 525)"/>
    <use href="#ray" transform="rotate(285 500 525)"/>
    <use href="#ray" transform="rotate(300 500 525)"/>
    <use href="#ray" transform="rotate(315 500 525)"/>
    <use href="#ray" transform="rotate(330 500 525)"/>
    <use href="#ray" transform="rotate(345 500 525)"/>
  </g>

  <!-- the Monkey King -->
  <g transform="translate(500 525) scale(1.05) translate(-500 -485)">
    <!-- fur -->
    <g fill="#E4261C">
      <path d="M330 380 C290 320 290 260 318 205 C330 250 352 270 380 272 C368 220 378 175 412 140 C412 190 432 220 462 228 C458 180 470 140 500 100 C530 140 542 180 538 228 C568 220 588 190 588 140 C622 175 632 220 620 272 C648 270 670 250 682 205 C710 260 710 320 670 380 Z"/>
      <circle cx="232" cy="525" r="82"/>
      <circle cx="768" cy="525" r="82"/>
      <ellipse cx="500" cy="530" rx="262" ry="265"/>
      <path d="M262 590 Q215 640 172 652 Q220 668 258 672 Q228 720 200 748 Q250 745 300 735 Q290 775 285 810 Q340 785 400 772 Z"/>
      <path d="M738 590 Q785 640 828 652 Q780 668 742 672 Q772 720 800 748 Q750 745 700 735 Q710 775 715 810 Q660 785 600 772 Z"/>
    </g>
    <g fill="#B3160E">
      <circle cx="232" cy="528" r="46"/>
      <circle cx="768" cy="528" r="46"/>
      <path d="M268 392 Q500 450 732 392 L735 425 Q500 482 265 425 Z" opacity=".55" clip-path="url(#skull)"/>
    </g>

    <!-- face -->
    <g fill="#F7DDB8">
      <circle cx="418" cy="530" r="120"/>
      <circle cx="582" cy="530" r="120"/>
      <ellipse cx="500" cy="670" rx="165" ry="115"/>
    </g>

    <!-- golden circlet -->
    <g fill="none" stroke="url(#gold)" stroke-linecap="round">
      <path d="M268 390 Q500 440 732 390" stroke-width="40"/>
      <path d="M268 390 Q224 404 228 446 Q234 480 264 472 Q284 464 272 444" stroke-width="20"/>
      <path d="M732 390 Q776 404 772 446 Q766 480 736 472 Q716 464 728 444" stroke-width="20"/>
    </g>
    <path d="M500 330 L536 392 L500 450 L464 392 Z" fill="url(#gold)"/>
    <path d="M500 360 L518 392 L500 422 L482 392 Z" fill="#E4261C"/>

    <!-- brows -->
    <g fill="#E4261C">
      <path d="M482 500 Q410 452 296 432 Q356 478 470 516 Z"/>
      <path d="M518 500 Q590 452 704 432 Q644 478 530 516 Z"/>
    </g>

    <!-- fiery golden eyes -->
    <g stroke="#0C1424" stroke-width="13" stroke-linejoin="round" fill="#F5B83D">
      <path d="M478 552 Q410 500 320 492 Q350 520 352 530 Q410 582 478 552 Z"/>
      <path d="M522 552 Q590 500 680 492 Q650 520 648 530 Q590 582 522 552 Z"/>
    </g>
    <circle cx="425" cy="540" r="24" fill="#0C1424"/>
    <circle cx="575" cy="540" r="24" fill="#0C1424"/>
    <circle cx="432" cy="532" r="7" fill="#fff"/>
    <circle cx="582" cy="532" r="7" fill="#fff"/>

    <!-- nose + smirk -->
    <g fill="#7A2E1A">
      <ellipse cx="481" cy="625" rx="10" ry="14" transform="rotate(-20 481 625)"/>
      <ellipse cx="519" cy="625" rx="10" ry="14" transform="rotate(20 519 625)"/>
    </g>
    <path d="M440 690 Q512 722 570 672" fill="none" stroke="#7A2E1A" stroke-width="14" stroke-linecap="round"/>
    <path d="M562 660 Q580 668 584 686" fill="none" stroke="#7A2E1A" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
