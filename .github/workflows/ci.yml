name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Typecheck, judge dry run, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Judge dry run (offline engine)
        run: npm run judge:dryrun
      - run: npx next build

  program:
    name: Program unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --manifest-path programs/wukong/Cargo.toml --lib

  chain:
    name: Chain suite (integration tests, e2e, x402)
    runs-on: ubuntu-latest
    env:
      SOLANA_VERSION: v2.3.13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C "$HOME"
          echo "$HOME/solana-release/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: bash scripts/ci-chain.sh
      - name: Logs on failure
        if: failure()
        run: tail -n 80 .anchor/ci/*.log || true
